<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be Like Me — The Chill Guy Edition</title>

<style>
:root{
  --bg:#ffffff;
  --ink:#0f172a;
  --muted:#64748b;
  --card:#ffffff;
  --line:#e5e7eb;
  --accent:#ec4899;
}
[data-theme="dark"]{
  --bg:#0b1220;
  --ink:#e5e7eb;
  --muted:#94a3b8;
  --card:#0f172a;
  --line:#1f2937;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial;
  background:var(--bg);
  color:var(--ink);
  transition:background .3s,color .3s;
}

/* Top */
.top{
  position:sticky;top:0;z-index:10;
  background:color-mix(in oklab,var(--bg),transparent 10%);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.top-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
}
h1{margin:0;font-size:clamp(20px,3vw,28px)}
.controls{display:flex;gap:10px}
.btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:999px;
  padding:8px 14px;
  cursor:pointer;
  font-weight:600;
}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:80px 20px 120px}
.section{margin:120px 0;opacity:0;transform:translateY(30px);transition:.6s}
.section.show{opacity:1;transform:none}
.center{display:grid;place-items:center;gap:24px;position:relative}

/* Hero */
.hero{
  max-width:360px;width:100%;
  border-radius:24px;
  box-shadow:0 30px 60px rgba(0,0,0,.18);
}
.dialogue{
  display:flex;align-items:center;gap:14px;
  font-size:20px;font-weight:600;
}
.heart{
  width:18px;height:18px;background:var(--accent);
  position:relative;transform:rotate(-45deg);
  animation:beat 1.1s infinite;
}
.heart:before,.heart:after{
  content:"";position:absolute;width:18px;height:18px;background:var(--accent);border-radius:50%;
}
.heart:before{top:-9px;left:0}
.heart:after{left:9px;top:0}
@keyframes beat{50%{transform:rotate(-45deg) scale(1.25)}}

/* Arrow */
.arrow{
  position:absolute;right:-160px;top:50%;
  width:160px;height:2px;
  background:linear-gradient(90deg,transparent,#38bdf8);
  animation:fly 1.2s infinite ease-in-out;
}
.arrow:after{
  content:"";position:absolute;right:-6px;top:-4px;
  border:6px solid transparent;border-left-color:#38bdf8;
}
@keyframes fly{0%{transform:translateX(-20px)}100%{transform:none}}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:40px;
  box-shadow:0 22px 50px rgba(0,0,0,.12);
}
.gifbox{display:grid;place-items:center;gap:18px;position:relative}
.gifbox img{
  max-width:320px;width:100%;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.18);
}
.label{
  position:absolute;top:-14px;left:-14px;
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--card);
  border:1px solid var(--line);
  font-weight:700;
}
.caption{font-size:18px;text-align:center}

/* Grid */
.row{display:grid;grid-template-columns:1fr 1fr;gap:72px}
@media(max-width:900px){
  .row{grid-template-columns:1fr;gap:56px}
  .arrow{display:none}
}

/* Hidden */
.hidden{display:none}

/* Overlay text (horizontal fix) */
.overlay{
  position:absolute;left:16px;right:16px;bottom:14px;
  background:color-mix(in oklab,var(--card),transparent 10%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  text-align:center;
  font-weight:700;
}

/* Footer */
footer{margin-top:140px;text-align:center;color:var(--muted)}
</style>
</head>

<body>
<div class="top">
  <div class="top-inner">
    <h1>Be Like Me — The Chill Guy Edition</h1>
    <div class="controls">
      <button class="btn" id="themeBtn">🌙</button>
      <button class="btn" id="muteBtn">🔇 Unmute</button>
    </div>
  </div>
</div>

<audio id="bgm" loop>
  <source src="just chill likeandsubscribe share funny dinosaur.mp3" type="audio/mpeg">
</audio>

<!-- subtle sfx -->
<audio id="sfxB"><source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="sfxC"><source src="https://actions.google.com/sounds/v1/impacts/crash.ogg"></audio>

<main class="wrap">

<!-- HERO -->
<section class="section center">
  <img class="hero" src="image-center.jpg" alt="Chill Guy">
  <div class="dialogue">
    <span class="heart"></span>
    <span id="type1"></span>
    <span class="heart"></span>
  </div>
  <span class="arrow"></span>
</section>

<!-- GIF 1 -->
<section class="section card">
  <div class="gifbox">
    <span class="label">A</span>
    <img src="gif1.gif" alt="GIF 1">
    <div class="caption" id="type2"></div>
  </div>
</section>

<!-- GIF 2 & 3 -->
<section class="section card">
  <div class="row">
    <div class="gifbox">
      <span class="label">B</span>
      <button class="btn" id="btn2">Mujse To Uljhana Bhee Mat Wrnaa</button>
      <img id="gif2" class="hidden" src="gif2.gif" alt="GIF 2">
    </div>

    <div class="gifbox">
      <span class="label">C</span>
      <button class="btn" id="btn3">Nahi Manegaa Ulajhana hee hai Mujsee</button>
      <div style="position:relative">
        <img id="gif3" class="hidden" src="gif3.gif" alt="GIF 3">
        <div id="gif3Text" class="overlay hidden">
          To Tuu aaj Mere Haathoon Khtaam Hai Beta
        </div>
      </div>
    </div>
  </div>
</section>

<footer id="egg" class="hidden">
  🎉 You reached the end. Officially **Chill** 😌
</footer>
</main>

<script>
/* Story scroll */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>e.isIntersecting&&e.target.classList.add('show'));
},{threshold:.15});
document.querySelectorAll('.section').forEach(s=>io.observe(s));

/* Typewriter */
function type(el,text,spd=45){
  let i=0;el.textContent="";
  const t=setInterval(()=>{el.textContent+=text[i++];if(i>=text.length)clearInterval(t)},spd);
}
type(document.getElementById('type1'),"Mai To Chill Guy hu Ekdam");
type(document.getElementById('type2'),"Mai To Sbkoo Ignore Krr Deti Hu.. Issliye to Chill Hu Laadlee",28);

/* Audio */
const bgm=document.getElementById('bgm');
const muteBtn=document.getElementById('muteBtn');
let playing=false;
muteBtn.onclick=()=>{
  if(!playing){bgm.play();playing=true;muteBtn.textContent='🔊 Mute'}
  else{bgm.pause();playing=false;muteBtn.textContent='🔇 Unmute'}
};

/* Theme */
const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{
  document.body.dataset.theme=document.body.dataset.theme?'':'dark';
  themeBtn.textContent=document.body.dataset.theme?'☀️':'🌙';
};

/* GIF actions + SFX */
btn2.onclick=()=>{
  gif2.classList.remove('hidden');
  document.getElementById('sfxB').play();
};
btn3.onclick=()=>{
  gif3.classList.remove('hidden');
  gif3Text.classList.remove('hidden');
  document.getElementById('sfxC').play();
  document.getElementById('egg').classList.remove('hidden');
};
</script>
</body>
</html>
